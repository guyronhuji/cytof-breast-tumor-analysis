site_name: cytof-transform
site_description: sctransform-like normalization for CyTOF / mass-cytometry data
site_url: https://guyronhuji.github.io/cytof-transform/
repo_url: https://github.com/guyronhuji/cytof-transform
repo_name: guyronhuji/cytof-transform

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - API Reference:
    - Overview: api/index.md
    - Config & Results: api/data_classes.md
    - Normalization: api/normalization.md
    - Diagnostics: api/diagnostics.md
    - QC Plots: api/plots.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
